<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Email Registration</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec80",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102219",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Smooth fade in for content */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1b14] dark:text-gray-100 transition-colors duration-300 min-h-screen relative overflow-hidden flex flex-col group/design-root">
<!-- Decorative Background Layer -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<!-- Top Right Blob -->
<div class="absolute -top-[10%] -right-[10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[100px] opacity-60"></div>
<!-- Bottom Left Blob -->
<div class="absolute top-[40%] -left-[10%] w-[400px] h-[400px] bg-blue-400/10 dark:bg-blue-900/10 rounded-full blur-[80px] opacity-50"></div>
<!-- Bottom Right Subtle Glow -->
<div class="absolute bottom-0 right-0 w-[300px] h-[300px] bg-primary/5 rounded-full blur-[60px]"></div>
</div>
<!-- Main Content Wrapper -->
<div class="relative z-10 flex flex-col flex-1 w-full max-w-[480px] mx-auto px-6 py-6 h-screen max-h-screen justify-between">
<!-- Top Bar / Navigation -->
<div class="flex items-center justify-between w-full pt-2">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-[#0d1b14] dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="w-10"></div> <!-- Spacer for optical centering if needed, or remove -->
</div>
<!-- Center Content: Hero & Form -->
<div class="flex flex-col justify-center flex-1 w-full animate-fade-in">
<!-- Logo / Icon -->
<div class="flex justify-center mb-8">
<div class="w-20 h-20 rounded-2xl bg-white dark:bg-white/5 shadow-sm flex items-center justify-center text-primary border border-[#cfe7db]/30 dark:border-white/10">
<span class="material-symbols-outlined text-[40px]">spa</span>
</div>
</div>
<!-- Headline Text -->
<div class="text-center mb-8 px-4">
<h1 class="text-[#0d1b14] dark:text-white tracking-tight text-[32px] font-bold leading-tight mb-3">
                    Find your calm
                </h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">
                    Enter your email to save your progress and personalize your journey.
                </p>
</div>
<!-- Input Form -->
<div class="w-full space-y-6 px-2">
<label class="flex flex-col w-full group">
<span class="text-[#0d1b14] dark:text-gray-300 text-sm font-medium leading-normal pb-2 pl-4">Email address</span>
<div class="relative">
<input class="flex w-full min-w-0 resize-none overflow-hidden rounded-2xl text-[#0d1b14] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#cfe7db] dark:border-white/10 bg-white dark:bg-white/5 focus:border-primary h-14 placeholder:text-[#4c9a73]/60 dark:placeholder:text-gray-500 p-[15px] pl-5 text-base font-normal leading-normal transition-all shadow-sm" placeholder="name@example.com" type="email" value=""/>
<!-- Optional decorative icon inside input -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</label>
<!-- Action Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 bg-primary hover:bg-[#0fd671] active:scale-[0.99] transition-all shadow-lg shadow-primary/20 text-[#0d1b14] text-base font-bold leading-normal tracking-[0.015em] mt-4">
<span class="truncate">Continue</span>
</button>
</div>
</div>
<!-- Footer: Privacy Policy -->
<div class="w-full text-center pb-6 pt-4 animate-fade-in" style="animation-delay: 0.2s;">
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">
                We respect your peace. 
                <a class="underline decoration-slate-300 dark:decoration-slate-600 hover:text-primary dark:hover:text-primary transition-colors ml-1" href="#">Privacy Policy</a>
</p>
</div>
</div>
</body></html>
